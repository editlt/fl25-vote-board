name: Deploy site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/index.html', '.github/workflows/deploy.yml']
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: d
        uses: actions/deploy-pages@v4
